name: Deploy blog

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 15 * * *"   # 매일 00:05 KST — 날짜가 오늘이 된 예약 글을 발행
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (예약 글 필터링 포함)
        run: node build.js
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          mkdir -p _site/content
          cp -r content/images _site/content/ 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
