<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 작은 서재</title>
  <meta name="description" content="일상과 생각을 기록하는 개인 블로그">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
:root {
  --paper: #f5f6f4;
  --card: #ffffff;
  --ink: #14181f;
  --muted: #586170;
  --line: #d9dde2;
  --accent: #2a3f8f;
  --accent-soft: #e6eaf6;
  --seal: #c23b2a;

  --display: "Nanum Myeongjo", "Noto Serif KR", Georgia, serif;
  --prose: "Gowun Batang", "Noto Serif KR", Georgia, serif;
  --ui: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  --r-sm: 2px; --r-md: 6px; --r-full: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151b; --card: #1a1e26; --ink: #e6e9ee; --muted: #9099a8;
    --line: #2c323d; --accent: #9bb0f5; --accent-soft: #232a40; --seal: #e8705b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151b; --card: #1a1e26; --ink: #e6e9ee; --muted: #9099a8;
  --line: #2c323d; --accent: #9bb0f5; --accent-soft: #232a40; --seal: #e8705b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  line-height: 1.7;
  transition: background .2s, color .2s;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; }

.site-header, main, .site-footer {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.site-header {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: var(--s5); padding-bottom: var(--s4);
  border-bottom: 1px solid var(--ink);
  box-shadow: 0 3px 0 -2px var(--paper), 0 4px 0 -2px var(--line);
}
.brand { display: inline-flex; align-items: center; gap: var(--s2); font-family: var(--display); font-weight: 800; font-size: 1.15rem; text-decoration: none; }
.seal {
  width: 22px; height: 22px; background: var(--seal); color: var(--paper);
  display: inline-grid; place-items: center; font-size: 13px; line-height: 1;
  border-radius: var(--r-sm); transform: rotate(-3deg);
}
nav { display: flex; gap: var(--s4); align-items: center; font-size: .92rem; }
nav a { text-decoration: none; color: var(--muted); }
nav a:hover { color: var(--accent); }
#theme-toggle {
  background: none; border: 1px solid var(--line); color: var(--ink);
  width: 32px; height: 32px; border-radius: var(--r-full); cursor: pointer; font-size: 1rem;
}
#theme-toggle:hover { border-color: var(--accent); }

main { padding-top: var(--s7); padding-bottom: var(--s8); min-height: 60vh; }

.intro { margin-bottom: var(--s6); }
.intro h1 { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.35; margin: 0 0 var(--s2); }
.intro p { margin: 0; color: var(--muted); font-family: var(--prose); }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--s5); }
.tools input {
  flex: 1 1 200px; padding: 8px 14px; font: inherit; font-size: .9rem;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--card); color: var(--ink);
}
.tools input::placeholder { color: var(--muted); }
.tools input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.tag {
  display: inline-block; padding: 2px 10px; font: 500 .78rem var(--mono); letter-spacing: .02em;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  color: var(--muted); text-decoration: none; background: transparent; cursor: pointer;
}
.tag:hover { color: var(--accent); border-color: var(--accent); }
.tag.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.post-item { padding: var(--s5) 0; border-bottom: 1px solid var(--line); }
.post-item h2 { font-family: var(--display); font-weight: 700; font-size: 1.4rem; margin: var(--s1) 0 var(--s2); line-height: 1.45; }
.post-item h2 a {
  text-decoration: none;
  background: linear-gradient(var(--accent), var(--accent)) 0 100% / 0 1px no-repeat;
  transition: background-size .2s, color .2s;
}
.post-item h2 a:hover { color: var(--accent); background-size: 100% 1px; }
.post-item p { margin: 0 0 var(--s3); color: var(--muted); font-family: var(--prose); font-size: .95rem; }
.meta { font: .75rem var(--mono); letter-spacing: .03em; color: var(--muted); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

.post-head h1 { font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1.35; margin: var(--s2) 0 var(--s3); }
.post-head { padding-bottom: var(--s5); border-bottom: 1px solid var(--line); margin-bottom: var(--s6); }
.back { font-size: .88rem; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--accent); }

.prose { font-family: var(--prose); font-size: 1.06rem; line-height: 2; }
.prose h2, .prose h3 { font-family: var(--display); font-weight: 700; margin: 2em 0 .5em; line-height: 1.5; }
.prose p { margin: 0 0 1.4em; }
.prose a { color: var(--accent); }
.prose blockquote {
  margin: 1.6em 0; padding: 4px var(--s5); border-left: 2px solid var(--seal);
}
.prose blockquote p { margin: .6em 0; }
.prose code {
  font-family: var(--mono); font-size: .85em;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 1px 6px;
}
.prose pre {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: var(--s4); overflow-x: auto; line-height: 1.7;
}
.prose pre code { background: none; border: 0; padding: 0; }
.prose img { max-width: 100%; border-radius: var(--r-sm); }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
.prose ul, .prose ol { margin: 0 0 1.4em; padding-left: 1.4em; }

.site-footer {
  padding-top: var(--s5); padding-bottom: var(--s7);
  border-top: 1px solid var(--line); color: var(--muted); font-size: .82rem;
}

@media (max-width: 480px) {
  .post-head h1 { font-size: 1.65rem; }
  .intro h1 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/"><span class="seal">서</span>나의 작은 서재</a>
    <nav>
      <a href="#/">글</a>
      <a href="#/about">소개</a>
      <button id="theme-toggle" aria-label="다크 모드 전환">◐</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <p>© <span id="year"></span> 나의 작은 서재 · 천천히, 꾸준히 씁니다.</p>
  </footer>

  <script>
/*DATA_START*/
window.POSTS = [
  {
    "id": "아침 커피 한 잔의 여유",
    "title": "아침 커피 한 잔의 여유",
    "date": "2026-10-18",
    "tags": [
      "일상"
    ],
    "summary": "바쁜 아침에도 십 분만 나를 위해 쓰기로 했다.",
    "content": "\n요즘은 아침마다 커피를 내린다. 물이 끓는 소리, 원두가 갈리는 향, 천천히 떨어지는 갈색 방울.\n\n## 십 분의 규칙\n\n휴대폰은 보지 않는다. 창밖을 보거나, 아무것도 하지 않는다.\n\n```\n06:50  물 끓이기\n06:55  커피 내리기\n07:00  아무것도 안 하기\n```\n\n별것 아닌데, 하루의 속도가 달라진다.\n"
  },
  {
    "id": "첫 글, 천천히 시작해 봅니다",
    "title": "첫 글, 천천히 시작해 봅니다",
    "date": "2026-10-21",
    "tags": [
      "일상",
      "시작"
    ],
    "summary": "블로그를 열었습니다. 거창한 목표 대신 작은 기록부터.",
    "content": "\n오래 미뤄 두었던 블로그를 드디어 열었다. 뭘 써야 할지 몰라 한참 망설였지만, 결국 **일단 쓰는 것**이 가장 좋은 시작이라는 결론에 도착했다.\n\n## 이곳에는 무엇을 적을까\n\n- 하루 중 문득 스친 생각\n- 읽은 책과 본 영화에 대한 짧은 메모\n- 나중에 다시 꺼내 보고 싶은 순간들\n\n> 기록하지 않은 하루는 쉽게 사라진다.\n\n## 앞으로\n\n매주 한 편, 길지 않아도 괜찮다. 완벽한 글보다 **꾸준한 글**을 목표로 한다.\n\n읽어 주셔서 고맙습니다.\n"
  }
];
window.ABOUT = "안녕하세요, 이곳은 일상과 생각을 천천히 기록하는 작은 공간입니다.\n\n## 연락\n\n- 이메일: (여기에 적어 주세요)\n";
/*DATA_END*/
</script>
  <script>
(function () {
  const app = document.getElementById("app");
  const posts = (window.POSTS || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  let query = "";

  document.getElementById("year").textContent = new Date().getFullYear();

  // ---------- theme ----------
  const root = document.documentElement;
  try {
    const saved = localStorage.getItem("theme");
    if (saved) root.dataset.theme = saved;
  } catch (e) {}
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const dark = getComputedStyle(root).getPropertyValue("--paper").trim() === "#12151b";
    const next = dark ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  // ---------- markdown ----------
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  function inline(s) {
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
      /^(https?:|mailto:|#|\/)/.test(u) ? `<a href="${u}">${t}</a>` : m);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    return s;
  }

  function markdown(src) {
    const lines = src.replace(/\r/g, "").trim().split("\n");
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++;
        out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
      } else if (/^#{1,3}\s/.test(line)) {
        const level = line.match(/^#+/)[0].length;
        out.push(`<h${level}>${inline(line.replace(/^#+\s/, ""))}</h${level}>`);
        i++;
      } else if (/^---+$/.test(line.trim())) {
        out.push("<hr>"); i++;
      } else if (/^>\s?/.test(line)) {
        const q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        out.push(`<blockquote>${markdown(q.join("\n"))}</blockquote>`);
      } else if (/^\s*[-*]\s/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*[-*]\s/, ""))}</li>`);
        out.push(`<ul>${items.join("")}</ul>`);
      } else if (/^\s*\d+\.\s/.test(line)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*\d+\.\s/, ""))}</li>`);
        out.push(`<ol>${items.join("")}</ol>`);
      } else if (line.trim() === "") {
        i++;
      } else {
        const p = [];
        while (i < lines.length && lines[i].trim() !== "" && !/^(```|#{1,3}\s|>|\s*[-*]\s|\s*\d+\.\s|---+$)/.test(lines[i])) p.push(lines[i++]);
        out.push(`<p>${inline(p.join("<br>"))}</p>`);
      }
    }
    return out.join("\n");
  }

  // ---------- views ----------
  const fmtDate = d => {
    const [y, m, day] = d.split("-");
    return `${y}.${m}.${day}`;
  };
  const readTime = text => Math.max(1, Math.round(text.replace(/\s/g, "").length / 500));

  function tagLink(t, active) {
    return `<a class="tag${active ? " active" : ""}" href="#/tag/${encodeURIComponent(t)}">#${esc(t)}</a>`;
  }

  function listView(tag) {
    const allTags = [...new Set(posts.flatMap(p => p.tags || []))];
    const q = query.trim().toLowerCase();
    const shown = posts.filter(p =>
      (!tag || (p.tags || []).includes(tag)) &&
      (!q || (p.title + p.summary + p.content).toLowerCase().includes(q)));

    app.innerHTML = `
      <section class="intro">
        <h1>${tag ? "#" + esc(tag) : "오늘의 기록"}</h1>
        <p>${tag ? shown.length + "개의 글" : "일상과 생각을 천천히 적어 둡니다."}</p>
      </section>
      <div class="tools">
        <input id="search" type="search" placeholder="글 검색…" value="${esc(query)}">
        <a class="tag${tag ? "" : " active"}" href="#/">전체</a>
        ${allTags.map(t => tagLink(t, t === tag)).join("")}
      </div>
      <div id="list">${listItems(shown)}</div>`;

    const input = document.getElementById("search");
    input.addEventListener("input", () => {
      query = input.value;
      const qq = query.trim().toLowerCase();
      const res = posts.filter(p =>
        (!tag || (p.tags || []).includes(tag)) &&
        (!qq || (p.title + p.summary + p.content).toLowerCase().includes(qq)));
      document.getElementById("list").innerHTML = listItems(res);
    });
  }

  function listItems(list) {
    if (!list.length) return '<p class="empty">일치하는 글이 없어요.</p>';
    return list.map(p => `
      <article class="post-item">
        <div class="meta">${fmtDate(p.date)} · ${readTime(p.content)}분 읽기</div>
        <h2><a href="#/post/${encodeURIComponent(p.id)}">${esc(p.title)}</a></h2>
        <p>${esc(p.summary || "")}</p>
        <div>${(p.tags || []).map(t => tagLink(t)).join(" ")}</div>
      </article>`).join("");
  }

  function postView(id) {
    const idx = posts.findIndex(p => p.id === id);
    if (idx < 0) return notFound();
    const p = posts[idx];
    document.title = `${p.title} · 나의 작은 서재`;
    app.innerHTML = `
      <a class="back" href="#/">← 목록으로</a>
      <article>
        <header class="post-head">
          <div class="meta">${fmtDate(p.date)} · ${readTime(p.content)}분 읽기</div>
          <h1>${esc(p.title)}</h1>
          <div>${(p.tags || []).map(t => tagLink(t)).join(" ")}</div>
        </header>
        <div class="prose">${markdown(p.content)}</div>
      </article>`;
  }

  function aboutView() {
    app.innerHTML = `
      <section class="intro"><h1>소개</h1></section>
      <div class="prose">${markdown(window.ABOUT || "")}</div>`;
  }

  function notFound() {
    app.innerHTML = '<p class="empty">페이지를 찾을 수 없어요. <a href="#/">홈으로</a></p>';
  }

  // ---------- router ----------
  function route() {
    document.title = "나의 작은 서재";
    const hash = location.hash.replace(/^#\/?/, "");
    const [name, ...rest] = hash.split("/");
    const arg = decodeURIComponent(rest.join("/"));
    if (!name) listView();
    else if (name === "tag") listView(arg);
    else if (name === "post") postView(arg);
    else if (name === "about") aboutView();
    else notFound();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
